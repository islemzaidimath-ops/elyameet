services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: elyameet
      POSTGRES_PASSWORD: elyameet_pass
      POSTGRES_DB: elyameet_db
    ports:
      - "5432:5432"

  api:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@elyameet.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    