services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: elyameet
      POSTGRES_PASSWORD: elyameet_pass
      POSTGRES_DB: elyameet_db
    ports:
      - "5432:5432"

  api:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/code